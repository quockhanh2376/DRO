[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dro"
dynamic = ["version"]
description = "DNS Route Optimizer core engine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "SQLAlchemy>=2,<3", "alembic>=1.13,<2", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "Jinja2>=3.1,<4", "python-multipart>=0.0.9,<1", "itsdangerous>=2.1,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
dro = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
