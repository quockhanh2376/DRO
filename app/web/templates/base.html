<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DRO{% endblock %} · DNS Route Optimizer</title>
  <link rel="stylesheet" href="/static/style.css?v=header-2">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body hx-boost="true">
  <header class="topbar"><a class="brand" href="/">DRO <span class="brand-version">{{ version }}</span></a><nav>
    <a href="/">Dashboard</a><a href="/targets">Targets</a><a href="/history">History</a>
    <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link" type="submit">Log out</button></form>
  </nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
