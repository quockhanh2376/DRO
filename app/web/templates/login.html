<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · DRO</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="login"><section class="panel"><p class="eyebrow">DNS Route Optimizer</p><h1>Admin sign in</h1>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary span-2" type="submit">Sign in</button></form></section></main></body></html>
